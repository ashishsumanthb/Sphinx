name: sphinx-insights-demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sphinx_demo
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: sphinx
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - insights_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphinx_demo -d sphinx"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  insights_demo_data:
