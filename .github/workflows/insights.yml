name: Insights host integration
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sphinx_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: sphinx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U sphinx_test -d sphinx_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INSIGHTS_TEST_DATABASE_URL: postgres://sphinx_test:local_ci_only@127.0.0.1:5432/sphinx_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --package sphinx-insights --check
      - run: bash scripts/verify_insights.sh
