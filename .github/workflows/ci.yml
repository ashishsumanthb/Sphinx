name: Rust and PostgreSQL

on:
  pull_request:
  push:
    branches: [developer, 'feat/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sphinx_test
          POSTGRES_DB: sphinx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sphinx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:sphinx_test@localhost:5432/sphinx_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      # These suites reset public and must run serially on this disposable service.
      - name: PostgreSQL host API and repository tests
        run: >-
          cargo test --locked --test insights_host --test insights_postgres
          --test postgres_attempt_limits --test postgres_edge_cases
          -- --ignored --test-threads=1
